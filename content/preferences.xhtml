<linkset>
	<html:link rel="localization" href="agent-parser.ftl"/>
</linkset>

<vbox id="agentparser-prefpane" class="main-section" onload="AgentParserPrefs.init()">
	<!-- At a glance: whether setup is complete, what's running, and what failed -->
	<html:style>
		.agentparser-status-row { display: flex; align-items: center; gap: 6px; min-height: 28px; }
		.agentparser-status-row[hidden] { display: none; }
		.agentparser-status-row label, .agentparser-status-row button { margin: 0; }
	</html:style>
	<groupbox id="agentparser-status-box">
		<label><html:h2 data-l10n-id="agentparser-pref-status"/></label>
		<html:div class="agentparser-status-row">
			<html:img id="agentparser-status-icon" width="16" height="16"/>
			<html:span id="agentparser-status-text" style="font-weight: 600"/>
			<html:span style="flex: 1"/>
			<button id="agentparser-status-setup" data-l10n-id="agentparser-pref-finish-setup"
				oncommand="AgentParserPrefs.scrollToSetup()" hidden="true"/>
		</html:div>
		<html:div class="agentparser-status-row">
			<html:img src="chrome://agentparser/content/icons/queued.svg" width="16" height="16"/>
			<label id="agentparser-queue-status"/>
			<html:span style="flex: 1"/>
			<button data-l10n-id="agentparser-pref-clear-queue" oncommand="AgentParserPrefs.clearQueue()"/>
		</html:div>
		<html:div class="agentparser-status-row" id="agentparser-failures-line" hidden="hidden">
			<html:img src="chrome://agentparser/content/icons/failed.svg" width="16" height="16"/>
			<label id="agentparser-failures-status"/>
			<html:span style="flex: 1"/>
			<button data-l10n-id="agentparser-pref-retry-failed" oncommand="AgentParserPrefs.retryFailed()"/>
			<button data-l10n-id="agentparser-pref-clear-failures" oncommand="AgentParserPrefs.clearFailures()"/>
		</html:div>
		<description data-l10n-id="agentparser-pref-columns-hint"/>
	</groupbox>

	<!-- Which service parses what -->
	<groupbox id="agentparser-routing">
		<label><html:h2 data-l10n-id="agentparser-pref-mode"/></label>
		<radiogroup id="agentparser-default-provider" oncommand="AgentParserPrefs.update()"/>
		<description data-l10n-id="agentparser-pref-mode-desc"/>
		<description id="agentparser-single-provider-desc" data-l10n-id="agentparser-pref-single-provider-desc" hidden="true"/>
		<hbox id="agentparser-bulk-row" align="center">
			<label data-l10n-id="agentparser-pref-bulk-provider" control="agentparser-bulk-provider"/>
			<menulist id="agentparser-bulk-provider" native="true" oncommand="AgentParserPrefs.update()">
				<menupopup/>
			</menulist>
		</hbox>
		<html:span id="agentparser-routing-warning" style="color: var(--accent-red, #d70022)" hidden="hidden"/>
	</groupbox>

	<!-- One section per parsing service, from its descriptor's settings -->
	<vbox id="agentparser-provider-sections"/>

	<!-- The user's own providers -->
	<groupbox id="agentparser-custom-providers">
		<label><html:h2 data-l10n-id="agentparser-pref-custom-title"/></label>
		<description data-l10n-id="agentparser-pref-custom-desc"/>
		<html:code id="agentparser-custom-dir" style="user-select: text; overflow-wrap: anywhere;"/>
		<vbox id="agentparser-custom-list"/>
		<hbox align="center">
			<button data-l10n-id="agentparser-pref-custom-open" oncommand="AgentParserPrefs.openUserDir()"/>
			<html:a class="text-link" data-l10n-id="agentparser-pref-custom-docs"
				href="https://github.com/pymaster17/zotero-agent-parser/blob/main/docs/custom-providers.md"/>
		</hbox>
	</groupbox>

	<groupbox>
		<label><html:h2 data-l10n-id="agentparser-pref-general"/></label>
		<checkbox preference="extensions.agentparser.autoParse" data-l10n-id="agentparser-pref-auto-parse" native="true"/>
		<checkbox preference="extensions.agentparser.skipSyncedItems" data-l10n-id="agentparser-pref-skip-synced" native="true"/>
		<checkbox preference="extensions.agentparser.includeLinkedFiles" data-l10n-id="agentparser-pref-include-linked" native="true"/>
		<checkbox preference="extensions.agentparser.showNotifications" data-l10n-id="agentparser-pref-notifications" native="true"/>
		<grid class="form-grid">
			<html:label for="agentparser-timeout" data-l10n-id="agentparser-pref-timeout"/>
			<html:input id="agentparser-timeout" type="number" min="1" style="width: 5em"
				preference="extensions.agentparser.timeoutMinutes"/>
			<html:label for="agentparser-wait" data-l10n-id="agentparser-pref-wait-file"/>
			<html:input id="agentparser-wait" type="number" min="0" style="width: 5em"
				preference="extensions.agentparser.waitForFileMinutes"/>
		</grid>
	</groupbox>

	<groupbox>
		<label><html:h2 data-l10n-id="agentparser-pref-output"/></label>
		<description data-l10n-id="agentparser-pref-output-desc"/>
		<grid class="form-grid">
			<html:label for="agentparser-dirname" data-l10n-id="agentparser-pref-dir-name"/>
			<html:input id="agentparser-dirname" style="width: 12em"
				preference="extensions.agentparser.outputDirName"/>
			<html:label for="agentparser-tag" data-l10n-id="agentparser-pref-success-tag"/>
			<html:input id="agentparser-tag" style="width: 12em"
				preference="extensions.agentparser.successTag"/>
		</grid>
		<checkbox preference="extensions.agentparser.markForSync" data-l10n-id="agentparser-pref-mark-sync" native="true"/>
	</groupbox>
</vbox>
