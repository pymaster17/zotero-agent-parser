<!-- Settings for the mineru-local provider, inserted into the Agent Parser settings by preferences.js -->
	<grid class="form-grid">
		<html:label for="agentparser-local-tier" data-l10n-id="agentparser-pref-tier"/>
		<menulist id="agentparser-local-tier" preference="extensions.agentparser.providers.mineru-local.tier" native="true"
			oncommand="AgentParserProviderSettings['mineru-local'].update({ refresh: true })">
			<menupopup>
				<menuitem value="basic" data-l10n-id="agentparser-tier-basic"/>
				<menuitem value="standard" data-l10n-id="agentparser-tier-standard"/>
				<menuitem value="advanced" data-l10n-id="agentparser-tier-advanced"/>
			</menupopup>
		</menulist>
		<html:label for="agentparser-local-ocr" data-l10n-id="agentparser-pref-ocr-mode"/>
		<menulist id="agentparser-local-ocr" preference="extensions.agentparser.providers.mineru-local.ocrMode" native="true">
			<menupopup>
				<menuitem value="auto" label="auto"/>
				<menuitem value="txt" label="txt"/>
				<menuitem value="ocr" label="ocr"/>
			</menupopup>
		</menulist>
	</grid>
	<html:span id="agentparser-tier-desc"/>

	<checkbox id="agentparser-local-managed" preference="extensions.agentparser.providers.mineru-local.managed"
		data-l10n-id="agentparser-pref-managed" native="true"
		oncommand="AgentParserProviderSettings['mineru-local'].update({ refresh: true })"/>

	<!-- Plugin-managed install -->
	<vbox id="agentparser-local-managed-section">
		<grid class="form-grid">
			<html:label data-l10n-id="agentparser-local-env"/>
			<html:span id="agentparser-local-env-status"/>
			<html:label data-l10n-id="agentparser-local-models"/>
			<html:span id="agentparser-local-models-status"/>
			<html:label data-l10n-id="agentparser-local-server"/>
			<html:span id="agentparser-local-server-status"/>
		</grid>
		<hbox align="center">
			<button id="agentparser-local-install" data-l10n-id="agentparser-local-install" data-setup-focus="true"
				oncommand="AgentParserProviderSettings['mineru-local'].install()"/>
			<button id="agentparser-local-cancel" data-l10n-id="agentparser-local-cancel"
				oncommand="AgentParserProviderSettings['mineru-local'].cancelInstall()"/>
			<button id="agentparser-local-start" data-l10n-id="agentparser-local-start"
				oncommand="AgentParserProviderSettings['mineru-local'].test()"/>
			<button id="agentparser-local-stop" data-l10n-id="agentparser-local-stop"
				oncommand="AgentParserProviderSettings['mineru-local'].stopServer()"/>
		</hbox>
		<html:textarea id="agentparser-local-log" readonly="readonly" rows="8"
			style="font-family: monospace; font-size: 11px; white-space: pre; resize: vertical;"/>
		<grid class="form-grid">
			<html:label for="agentparser-local-envdir" data-l10n-id="agentparser-pref-env-dir"/>
			<html:input id="agentparser-local-envdir" style="flex: 1"
				preference="extensions.agentparser.providers.mineru-local.envDir"
				onchange="AgentParserProviderSettings['mineru-local'].update({ refresh: true })"/>
			<html:label for="agentparser-local-uv" data-l10n-id="agentparser-pref-uv-path"/>
			<html:input id="agentparser-local-uv" style="flex: 1"
				preference="extensions.agentparser.providers.mineru-local.uvPath"/>
			<html:label for="agentparser-local-source" data-l10n-id="agentparser-pref-model-source"/>
			<menulist id="agentparser-local-source" preference="extensions.agentparser.providers.mineru-local.modelSource" native="true">
				<menupopup>
					<menuitem value="auto" label="auto"/>
					<menuitem value="huggingface" label="Hugging Face"/>
					<menuitem value="modelscope" label="ModelScope"/>
				</menupopup>
			</menulist>
			<html:label for="agentparser-local-port" data-l10n-id="agentparser-pref-port"/>
			<html:input id="agentparser-local-port" type="number" min="1" max="65535" style="width: 6em"
				preference="extensions.agentparser.providers.mineru-local.port"/>
			<html:label for="agentparser-local-idle" data-l10n-id="agentparser-pref-idle-stop"/>
			<html:input id="agentparser-local-idle" type="number" min="0" style="width: 6em"
				preference="extensions.agentparser.providers.mineru-local.idleStopMinutes"/>
		</grid>
	</vbox>

	<!-- Server run by the user -->
	<vbox id="agentparser-local-external-section">
		<description data-l10n-id="agentparser-pref-external-desc"/>
		<grid class="form-grid">
			<html:label for="agentparser-local-url" data-l10n-id="agentparser-pref-url"/>
			<html:input id="agentparser-local-url" style="flex: 1"
				preference="extensions.agentparser.providers.mineru-local.url"/>
			<html:label for="agentparser-local-key" data-l10n-id="agentparser-pref-api-key"/>
			<html:input id="agentparser-local-key" type="password" style="flex: 1"
				preference="extensions.agentparser.providers.mineru-local.apiKey"/>
		</grid>
		<hbox align="center">
			<button data-l10n-id="agentparser-pref-test" oncommand="AgentParserProviderSettings['mineru-local'].test()"/>
		</hbox>
	</vbox>
	<label id="agentparser-mineru-local-test-result" crop="end"/>
